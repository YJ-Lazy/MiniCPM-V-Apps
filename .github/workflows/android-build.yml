name: Android Debug APK

on:
  push:
    branches:
      - main
    paths:
      - "MiniCPM-V-demo-Android/**"
      - "llama.cpp-omni"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # GitHub-hosted Ubuntu runners already include Android command-line tools.
      # Avoid setup-android here: that action tries to install the obsolete "tools" package.
      - name: Locate Android SDK manager
        id: android-sdk
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          echo "sdkmanager=$SDKMANAGER" >> "$GITHUB_OUTPUT"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | "${{ steps.android-sdk.outputs.sdkmanager }}" --licenses >/dev/null

      - name: Install Android build components
        shell: bash
        run: |
          "${{ steps.android-sdk.outputs.sdkmanager }}" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973" \
            "cmake;4.1.2"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: MiniCPM-V-demo-Android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniCPM-V-demo-Android-debug
          path: MiniCPM-V-demo-Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
