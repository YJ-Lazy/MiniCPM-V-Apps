name: Android Debug APK

on:
  push:
    branches:
      - main
    paths:
      - "MiniCPM-V-demo-Android/**"
      - "llama.cpp-omni"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The legacy "tools" package was removed from Google's SDK repository.
          packages: "platform-tools"

      - name: Install Android build components
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;4.1.2"

      - name: Patch macOS-only F_NOCACHE for Android
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path("llama.cpp-omni/src/llama-moe-slot.cpp")
          text = source.read_text()

          apply_pattern = re.compile(
              r'#ifndef _WIN32\n\s*std::lock_guard<std::mutex> lock\(fd_mutex\);\n'
              r'\s*for \(const auto & kv : fds\) \{\n'
              r'\s*if \(fcntl\(kv.second, F_NOCACHE, on \? 1 : 0\) != 0\) \{\n'
              r'\s*moe_log\("F_NOCACHE 切换失败: %s", std::strerror\(errno\)\);\n'
              r'\s*\}\n\s*\}\n#endif'
          )
          apply_replacement = """#ifdef __APPLE__
                  std::lock_guard<std::mutex> lock(fd_mutex);
                  for (const auto & kv : fds) {
                      if (fcntl(kv.second, F_NOCACHE, on ? 1 : 0) != 0) {
                          moe_log("F_NOCACHE 切换失败: %s", std::strerror(errno));
                      }
                  }
          #else
                  (void) on;
          #endif"""
          text, apply_count = apply_pattern.subn(lambda _: apply_replacement, text, count=1)

          open_pattern = re.compile(
              r'(#else\n\s*const int fd = open\(path\.c_str\(\), O_RDONLY \| O_CLOEXEC\);\n)'
              r'\s*if \(experts_nocache_desired\(\) && fcntl\(fd, F_NOCACHE, 1\) != 0\) \{\n'
              r'\s*moe_log\("F_NOCACHE 设置失败: %s", std::strerror\(errno\)\);\n'
              r'\s*\}\n#endif'
          )
          open_replacement = r'\1#ifdef __APPLE__\n        if (experts_nocache_desired() && fcntl(fd, F_NOCACHE, 1) != 0) {\n            moe_log("F_NOCACHE 设置失败: %s", std::strerror(errno));\n        }\n#endif\n#endif'
          text, open_count = open_pattern.subn(lambda m: m.expand(open_replacement), text, count=1)

          if apply_count != 1 or open_count != 1:
              raise SystemExit(f"Expected exactly one F_NOCACHE patch site each; got apply={apply_count}, open={open_count}.")
          source.write_text(text)
          print("Applied Android compatibility guard for Apple-only F_NOCACHE.")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: MiniCPM-V-demo-Android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniCPM-V-demo-Android-debug
          path: MiniCPM-V-demo-Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
